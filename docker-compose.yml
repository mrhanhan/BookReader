name: bookr

# The server and Postgres are intentionally not published on the host: the
# only public entry point is Caddy (`web`) on :8180. Publishing the server
# port would bypass TLS, CORS and the trusted-proxy configuration.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bookr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bookr -d bookr']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      # Browsers fetch presigned upload/cover/file URLs directly from MinIO,
      # so the S3 API must answer CORS preflights. Restrict this when the
      # public MinIO endpoint is exposed beyond the app origins.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-*}
    ports:
      # Host ports differ from the defaults so they do not clash with other
      # MinIO instances on the machine.
      - '9200:9000' # S3 API
      - '9201:9001' # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOST: 0.0.0.0
      # Requests arrive through exactly one Caddy hop, so login rate limiting
      # keys on the real client IP rather than the proxy address.
      TRUST_PROXY: '1'
      DATABASE_URL: postgres://bookr:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/bookr
      S3_ENDPOINT: http://minio:9000
      # Presigned upload/cover URLs are followed by the browser, so they must
      # use the host-published MinIO port instead of the container hostname.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9200}
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      S3_BUCKET: bookr
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 characters)}
      LIBRARY_QUOTA_BYTES: ${LIBRARY_QUOTA_BYTES:-85899345920}
      MEMBER_UPLOAD_QUOTA_BYTES: ${MEMBER_UPLOAD_QUOTA_BYTES:-21474836480}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      CORS_ORIGIN: '${CORS_ORIGIN:-http://localhost:8180,https://tauri.localhost,http://tauri.localhost,https://localhost,capacitor://localhost}'
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Empty for the same-origin web deployment; set it only when the same
        # bundle is served to native shells (Tauri/Capacitor).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '8180:80'
    volumes:
      - caddy_data:/data

volumes:
  pgdata:
  miniodata:
  caddy_data:
