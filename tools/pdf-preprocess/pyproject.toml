[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookr-preprocess"
version = "0.1.0"
description = "Generate reflow packs (*.bookr.json) from PDF books."
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24"]

[project.optional-dependencies]
ocr = ["paddleocr>=2.7", "numpy", "pillow"]
dev = ["pytest>=8"]

[project.scripts]
bookr-preprocess = "bookr_preprocess.cli:main"

[tool.setuptools.packages.find]
include = ["bookr_preprocess*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
